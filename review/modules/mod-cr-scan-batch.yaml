kind: module
name: mod-cr-scan-batch
description: Foreach local repo paths → nested o-code-review-single
tags: code-review, batch, foreach, quiet, no-screenshot
preferences:
  silent: true
  disable_notifications: true
  disable_logging: true
params:
  - name: repoListFile
    default: "{{Target}}"
  - name: flowsDir
    default: "review"
  - name: batchThreads
    default: "1"
dependencies:
  variables:
    - name: Target
      type: string
      required: true
steps:
  - name: setup-batch
    type: function
    log: "Creating batch CR output folders"
    functions:
      - 'create_folder("{{Output}}/cr")'
      - 'create_folder("{{Output}}/cr/batch")'

  - name: check-seed-file
    type: bash
    log: "Verifying repoListFile exists"
    commands:
      - |
        set -e
        LIST="{{repoListFile}}"
        if [ ! -f "$LIST" ]; then
          echo "FATAL: repoListFile missing: $LIST" | tee "{{Output}}/cr/FATAL.txt"
          exit 1
        fi
        NONCOMMENT=$(grep -vE '^(#|[[:space:]]*$)' "$LIST" | wc -l | tr -d ' ')
        echo "repoListFile=$LIST lines=$NONCOMMENT" > "{{Output}}/cr/batch/seed-info.txt"
        if [ "$NONCOMMENT" -lt 1 ]; then
          echo "FATAL: repoListFile has no paths: $LIST" | tee "{{Output}}/cr/FATAL.txt"
          exit 1
        fi

  - name: foreach-repos
    type: foreach
    log: "{{Output}}/cr/batch/foreach.log"
    input: "{{repoListFile}}"
    variable: repoPath
    threads: 1
    step:
      name: scan-one-nested
      type: bash
      command: |
        set -e
        export PATH="$HOME/.local/bin:$HOME/osmedeus-base/external-binaries:$PATH"
        RP="[[repoPath]]"
        case "$RP" in
          \#*|"") echo "skip blank/comment"; exit 0 ;;
        esac
        if [ ! -d "$RP" ]; then
          echo "MISSING_DIR $RP" >> "{{Output}}/cr/batch/errors.txt"
          exit 1
        fi
        echo "START $RP" >> "{{Output}}/cr/batch/progress.txt"
        osmedeus run -F "{{flowsDir}}" -f o-code-review-single \
          -t "$RP" \
          -p "repoFolder=$RP" \
          --disable-logging --silent --threads-hold 4 --concurrency 1 \
          || { echo "FAIL $RP" >> "{{Output}}/cr/batch/errors.txt"; exit 1; }
        echo "OK $RP" >> "{{Output}}/cr/batch/progress.txt"

  - name: write-batch-status
    type: bash
    log: "Writing batch STATUS"
    commands:
      - |
        {
          echo "repoListFile={{repoListFile}}"
          echo "flowsDir={{flowsDir}}"
          echo "progress_lines=$(wc -l < "{{Output}}/cr/batch/progress.txt" 2>/dev/null || echo 0)"
          echo "error_lines=$(wc -l < "{{Output}}/cr/batch/errors.txt" 2>/dev/null || echo 0)"
        } > "{{Output}}/cr/STATUS.txt"
