kind: flow
name: o-code-review-single
description: Code-review one local repo tree (BBP CR) — local-first SAST+secrets
tags: code-review, sast, secrets, quiet, no-screenshot
help:
  example_targets:
    - '/home/box/workspaces-source/<org>/<repo>/source/<tree>'
  usage: |
    export PATH="$HOME/.local/bin:$HOME/osmedeus-base/external-binaries:$PATH"
    # Example: REPO=/home/box/workspaces-source/<handle>/<org>/source/<tree>
    REPO=/home/box/workspaces-source/<org>/<repo>/source/<tree>
    osmedeus run -F review -f o-code-review-single \
      -t "$REPO" \
      -p repoFolder="$REPO" \
      --disable-logging --silent --threads-hold 4 --concurrency 1
preferences:
  silent: true
  disable_notifications: true
  disable_logging: true
dependencies:
  variables:
    - name: Target
      type: string
      required: true
modules:
  - name: frag-do-scan-repo-cr
    path: fragments/frag-do-scan-repo-cr.yaml
