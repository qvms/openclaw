kind: module
name: mod-surface-fail-loud-gate
description: Post-surface gate — targets-https-live present, png vs live URLs, naabu opens, hard-skip banner; writes surface-gate.txt
tags: surface, channel-o, omarchy, gate, fail-loud, no-network
preferences:
  silent: true
  disable_notifications: true
params:
  - name: HardSkipRegex
    default: ""
dependencies:
  variables:
    - name: Target
      type: string
      required: true
steps:
  - name: gate
    type: bash
    log: "{{Output}}/vuln/surface-gate.log"
    commands:
      - 'O="{{Output}}"; T="{{Target}}"; R="$O/vuln/surface-gate.txt"; mkdir -p "$O/vuln"; F=0; SKIP=0; if [ -n "{{HardSkipRegex}}" ]; then echo "$T" | grep -Eq "{{HardSkipRegex}}" && SKIP=1; fi; TL="$O/vuln/targets-https-live.txt"; LIVE=$( [ -f "$TL" ] && grep -c "^https://" "$TL" || echo 0); HX=$( [ -f "$O/probing/httpx-$T.txt" ] && wc -l < "$O/probing/httpx-$T.txt" || echo 0); FP=$( [ -f "$O/fingerprint/httpx-fingerprint-$T.jsonl" ] && wc -l < "$O/fingerprint/httpx-fingerprint-$T.jsonl" || echo 0); PNG=$(find "$O" -path "*screenshot*" -iname "*.png" 2>/dev/null | wc -l); OPEN=$(cat "$O"/portscan/*naabu* "$O"/ports/*naabu* 2>/dev/null | grep -Ec ":[0-9]+" || true); ARCH=$(ls "$O"/archive/* 2>/dev/null | wc -l); { echo "# surface gate apex=$T utc=$(date -u +%FT%TZ)"; echo "httpx=$HX fp=$FP https_live=$LIVE png=$PNG naabu_open=$OPEN archive_files=$ARCH"; [ $SKIP -eq 1 ] && echo "HARD-SKIP: $T"; if [ $SKIP -eq 0 ]; then [ -f "$TL" ] || { echo "FAIL: vuln/targets-https-live.txt missing"; F=1; }; [ "$LIVE" -gt 0 ] || { echo "FAIL: targets-https-live.txt empty"; F=1; }; [ "$LIVE" -gt 0 ] && [ "$PNG" -eq 0 ] && { echo "FAIL: png=0 with live=$LIVE — fix chrome/sandbox, retry once, else escalate"; F=1; }; [ "$HX" -gt 0 ] && [ "$OPEN" -eq 0 ] && { echo "FAIL: httpx=$HX but naabu_open=0 — verify connect-scan, retry with ips-clean, else escalate"; F=1; }; [ "$ARCH" -gt 0 ] || { echo "WARN: archive output empty"; }; fi; [ $F -eq 0 ] && echo "GATE: PASS" || echo "GATE: FAIL"; } > "$R"; cat "$R"; if [ $F -ne 0 ]; then exit 4; fi; touch "$O/surface-done.flag"'
