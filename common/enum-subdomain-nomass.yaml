kind: module
name: enum-subdomain-nomass
description: Enumerate subdomains via subfinder, amass, assetfinder, and findomain
tags: subdomain, enumeration, discovery, dns

params:
  - name: subfinderThreads
    default: "{{threads * 6}}"
  - name: subfinderConfig
    default: "{{ExternalConfigs}}/subfinder-provider-config.yaml"

dependencies:
  commands:
    - subfinder
    - findomain

  variables:
    - name: Target
      type: string
      required: true

reports:
  - name: final-subdomains
    path: "{{Output}}/subdomain/all-{{TargetSpace}}.txt"
    type: text
    description: Final list of subdomains

steps:
  - name: create-output-folders
    type: function
    log: "Creating output folders"
    functions:
      - 'create_folder("{{Output}}/subdomain/")'

  - name: subfinder-enum
    type: bash
    log: "Running subfinder subdomain enumeration"
    commands:
      - 'subfinder -d {{Target}} -provider-config {{subfinderConfig}} -t {{subfinderThreads}} -o {{Output}}/subdomain/{{TargetSpace}}-subfinder.txt >/dev/null 2>&1'

  - name: additional-sources
    type: function
    log: "Running assetfinder and findomain"
    functions:
      - 'exec_cmd("findomain -u {{Output}}/subdomain/{{TargetSpace}}-findomain.txt -t {{Target}} > /dev/null 2>&1")'
      - 'exec_cmd("assetfinder -subs-only {{Target}} >> {{Output}}/subdomain/{{TargetSpace}}-assetfinder.txt")'
    on_error:
      - action: continue

  - name: merge-subdomains
    type: function
    log: "Merging subdomain sources"
    functions:
      - 'append_file("{{Output}}/subdomain/subdomain-{{TargetSpace}}.txt", "{{Output}}/subdomain/{{TargetSpace}}-subfinder.txt")'
      - 'append_file("{{Output}}/subdomain/subdomain-{{TargetSpace}}.txt", "{{Output}}/subdomain/{{TargetSpace}}-amass.txt")'
      - 'append_file("{{Output}}/subdomain/subdomain-{{TargetSpace}}.txt", "{{Output}}/subdomain/{{TargetSpace}}-assetfinder.txt")'
      - 'append_file("{{Output}}/subdomain/subdomain-{{TargetSpace}}.txt", "{{Output}}/subdomain/{{TargetSpace}}-findomain.txt")'
    on_error:
      - action: continue

  - name: subdomain-sort
    type: function
    log: "Sorting final subdomain list"
    functions:
      - 'clean_sub("{{Output}}/subdomain/subdomain-{{TargetSpace}}.txt", "{{Target}}")'
      - 'sort_unix("{{Output}}/subdomain/subdomain-{{TargetSpace}}.txt")'
